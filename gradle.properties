# 8GB Mac: keep the Gradle daemon lean but enough for Compose builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Pin the JDK: the shell's JAVA_HOME points at an uninstalled Android Studio JBR.
org.gradle.java.home=/Users/darljedmatundan/.local/jdk/Contents/Home
